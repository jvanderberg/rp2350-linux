[package]
name = "sntrup761"
version = "0.4.0"
authors = ["Michael Lodder <redmike7@gmail.com>"]
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "hashing", "NTRU", "post-quantum"]
description = "Rust implementation of the Streamline NTRU Prime algorithm"
repository = "https://github.com/mikelodder7/sntrup761"
documentation = "https://docs.rs/crate/sntrup761"
categories = ["algorithms", "cryptography"]
readme = "README.md"
edition = "2024"

[features]
default = ["kgen", "ecap", "dcap"]
kgen = []
ecap = []
dcap = []
alloc = []
force-scalar = []
std = []
serde = ["dep:serdect"]
js = ["getrandom/wasm_js"]

[dependencies]
rand = { version = "0.10.0", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
subtle = { version = "2", default-features = false }
getrandom = { version = "0.4", optional = true }
serdect = { version = "0.4", optional = true }
thiserror = { version = "2.0", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }

[target.'cfg(any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "x86"))'.dependencies]
sha2 = { version = "0.10", default-features = false }

[target.'cfg(not(any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "x86")))'.dependencies]
sha2 = { version = "0.10", default-features = false }


[lib]
doctest = false
