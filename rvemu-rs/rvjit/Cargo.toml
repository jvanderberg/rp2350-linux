[package]
name = "rvjit"
version = "0.1.0"
edition = "2024"

[features]
# Emit RV32 Zbb (`rori`) in the soft-TLB helper (Hazard3 on RP2350).
zbb = []
# Same for the dispatcher and translator.
ram-code = ["rvcore/ram-code"]
# Translation on another host core (`Jit::enable_async`); without it the
# dispatcher carries none of its code.
async = []

[dependencies]
rvcore = { path = "../rvcore" }
