[package]
name = "rvemu"
version = "0.1.0"
edition = "2024"

[dependencies]
rvcore = { path = "../rvcore", features = ["instrument"] }
rvjit = { path = "../rvjit" }
libc = "0.2"

[features]
pv-buffers = ["rvcore/pv-buffers"]

[dev-dependencies]
# piosim's tests assemble their programs (the firmware's assembler)
pio-parser = "0.3"
