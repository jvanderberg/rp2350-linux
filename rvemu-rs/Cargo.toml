[workspace]
resolver = "2"
members = ["rvcore", "rvemu", "rvjit", "rvemu-virt", "rvemu-pico"]
# rvemu-virt (QEMU) and rvemu-pico (RP2350) are bare-metal riscv32 only;
# jittest-guest is a separate workspace built for the guest (rv32ima)
default-members = ["rvcore", "rvemu", "rvjit"]

[profile.release]
debug = true
lto = true
codegen-units = 1
panic = "abort"
