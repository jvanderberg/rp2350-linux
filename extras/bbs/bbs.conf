# bbs.conf - read by every bbs process at start
name=RP2350 BBS
sysop=sysop
# simultaneous callers (1-8)
max_users=4
# TCP port inetd listens on (read by bbsctl start)
telnet_port=23
# seconds of no keypress before a caller is hung up
idle_timeout=600
# largest XMODEM/YMODEM upload, in KB
max_upload_kb=16384
